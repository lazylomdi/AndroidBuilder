name: Python tests

on:
  push:
    branches: [master, feature/desktop-ui]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile desktop UI modules
        run: python -m py_compile desktop_ui/app.py desktop_ui/readiness_summary.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
